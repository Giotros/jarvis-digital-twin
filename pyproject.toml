[project]
name = "jarvis-george"
version = "3.0.0"
description = "Jarvis George — Architecting Autonomous Digital Twins (diploma thesis, University of Peloponnese)"
authors = [{ name = "George Trochidis" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
