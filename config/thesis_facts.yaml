# Τα πραγματικά στοιχεία της διπλωματικής.
#
# Αυτό το αρχείο είναι η ΜΟΝΗ πηγή αλήθειας για ό,τι αφορά την τεχνική
# υλοποίηση. Μπαίνει αυτούσιο στο prompt όταν ρωτάει καθηγητής ή εξεταστής.
#
# Γιατί υπάρχει: χωρίς αυτό, το μοντέλο απαντούσε ρευστά και λάθος —
# «Krikri-12B», «QLoRA πάνω στο BERTweet», «ανάλυση συναισθημάτων»,
# MongoDB, Django, TensorFlow. Τίποτα από αυτά δεν υπάρχει στο project.
# Ένα fine-tuned μοντέλο δεν «ξέρει» τι έχτισες· μαντεύει κάτι που ακούγεται
# σωστό. Σε εξέταση αυτό είναι το χειρότερο είδος αστοχίας, γιατί ακούγεται
# πειστικό.
#
# ΚΡΑΤΑ ΤΟ ΕΝΗΜΕΡΩΜΕΝΟ. Αν αλλάξει κάτι στην υλοποίηση και δεν αλλάξει εδώ,
# το twin θα λέει με βεβαιότητα κάτι που δεν ισχύει πια.

# Συμπυκνωμένη εκδοχή για το close register.
#
# Το πλήρες μπλοκ είναι ~715 λέξεις. Δοσμένο σε φίλο που ρωτά «τι έκανες
# φέτος», παρήγαγε 37 λέξεις προδιαγραφών — σωστές και εντελώς εκτός ύφους,
# όταν το μετρημένο μήκος του register είναι 6 λέξεις. Το μοντέλο
# αναπαράγει το σχήμα αυτού που του δίνεται, οπότε ένα δελτίο προδιαγραφών
# παράγει δελτίο προδιαγραφών.
#
# Δεν είναι παραγόμενη περίληψη αλλά χειρόγραφο πεδίο: ό,τι αφαιρείται εδώ
# είναι απόφαση, όχι τυχαίο κόψιμο. Πρέπει να καλύπτει όσα θα ρωτούσε
# κάποιος οικείος, και τίποτα παραπάνω.
brief: >-
  Το βασικό μοντέλο είναι το ελληνικό Krikri-8B (ΙΕΛ/Αθηνά), με QLoRA
  fine-tuning στα δικά μου μηνύματα. Ray για την εκπαίδευση, Ollama για να
  τρέχει τοπικά στο Mac, n8n για τη ροή. Δεν χρησιμοποιώ ChatGPT ούτε
  cloud — όλα τοπικά. Δεν μαθαίνει από τις συνομιλίες· η επανεκπαίδευση
  γίνεται χειροκίνητα.

title: >-
  Αρχιτεκτονική Αυτόνομων Ψηφιακών Διδύμων: Ένα Κλιμακούμενο Πλαίσιο
  Εξατομικευμένης Επικοινωνίας με χρήση Μεγάλων Ανοιχτών Γλωσσικών Μοντέλων

institution: Πανεπιστήμιο Πελοποννήσου, Τμήμα Ηλεκτρολόγων Μηχανικών και Μηχανικών Υπολογιστών

base_model:
  name: Llama-Krikri-8B-Instruct
  publisher: ILSP / Αθηνά Ε.Κ.
  parameters: 8 δισεκατομμύρια
  why: >-
    Ελληνόγλωσσο, ανοιχτό, με tokenizer προσαρμοσμένο στα ελληνικά.
    Το Mistral-7B σπάει τις ελληνικές λέξεις σε πολύ περισσότερα tokens.

fine_tuning:
  method: QLoRA
  quantisation: 4-bit NF4 με double quantisation
  rank: 64
  alpha: 128
  target_modules: 7 (q, k, v, o, gate, up, down projections)
  data: 13.289 ζεύγη ερώτησης-απάντησης από προσωπικές συνομιλίες
  completed: περίπου 78% ενός epoch (checkpoint 650)

distributed:
  framework: Ray
  api: TorchTrainer
  strategy: data parallelism με strided sharding
  why_not_model_parallel: >-
    Το μοντέλο χωράει σε ένα GPU σε 4-bit, οπότε ο διαμοιρασμός βαρών
    θα πρόσθετε επικοινωνία χωρίς όφελος.

data_pipeline:
  platform: Databricks
  architecture: Medallion (Bronze / Silver / Gold)
  sources: Viber SQLite export, email
  storage: Delta Lake

anonymisation:
  structured: >-
    296 τηλέφωνα, 137 email, 63 URL, 17 IBAN, 8 ΑΦΜ (με έλεγχο mod-11).
    Μετρημένα σε μοναδικά πεδία: το formatted_prompt είναι συνένωση των
    άλλων δύο, οπότε μια αφελής μέτρηση τα διπλασιάζει.
  finding_given_names: >-
    Ο κανόνας κεφαλαίου γράμματος έχανε βαφτιστικά ονόματα, γιατί στα
    casual ελληνικά κανείς δεν γράφει με κεφαλαία. Στην πρώτη μέτρηση
    8,1% των εγγραφών· με τον σημερινό, πλουσιότερο ανιχνευτή, το ίδιο
    αρχείο δίνει 14,2%. Η διαφορά δεν είναι διόρθωση — είναι η απόδειξη
    ότι η ανάκληση σε ανοιχτή κλάση δεν είναι γνωστή εκ των προτέρων.
  finding_surnames: >-
    Τα επώνυμα δεν καλύπτονταν καθόλου. 589 εμφανίσεις σε 551 εγγραφές
    (4,1%) επιβίωσαν στο v4, μπήκαν στην εκπαίδευση, και το μοντέλο τις
    εξέφερε σε αξιολόγηση.
  solution: >-
    Μορφολογική ανίχνευση με λεξικό θεμάτων και κλιτικές καταλήξεις για τα
    βαφτιστικά· 21 διακριτές καταλήξεις συν χειροκίνητο λεξικό για τα
    επώνυμα, γιατί η κατάληξη -ας δεν ξεχωρίζει όνομα από κοινή λέξη.
  pitfalls: >-
    Το casefold() στην Python μετατρέπει το τελικό σίγμα, οπότε λίστες
    γραμμένες φυσικά δεν ταίριαζαν ποτέ — συνέβη τέσσερις φορές. Επίσης
    ονόματα που είναι και ημερολογιακοί όροι (Παρασκευή, Κυριακή) ή
    τοπωνύμια (Μαρκόπουλο), και το «επειδή» που τελειώνει όπως ένα -ίδης.
  limitation: >-
    Μια αστοχία ανωνυμοποίησης δεν διορθώνεται μετά την εκπαίδευση, μόνο
    επικαλύπτεται. Το φίλτρο εξόδου κρύβει ένα όνομα που τα βάρη ήδη
    περιέχουν, και η επικάλυψη φαίνεται ίδια απ' έξω μέχρι να έχει κενό.

rag:
  retrieval: υβριδική — BM25 και dense embeddings
  fusion: Reciprocal Rank Fusion
  store: ChromaDB

orchestration:
  tool: n8n
  intents: 9 κατηγορίες (personal, knowledge, casual, memory, schedule, devops, weather, news, sensitive)
  tools: Gmail, Google Calendar, GitHub, Weather API, News API

deployment:
  runtime: Ollama, τοπικά σε Apple Silicon με Metal
  format: GGUF Q4_K_M (περίπου 5GB)
  adapter: >-
    Ο adapter εφαρμόζεται κατά την εκτέλεση με τη directive ADAPTER, αντί
    να γίνει merge στα βάρη — που θα απαιτούσε 16GB σε fp16.
  latency: περίπου 1,5 δευτερόλεπτα ανά απάντηση

evaluation:
  metrics: >-
    Απόσταση ύφους από τα golden examples, ποσοστό μη τεκμηριωμένων
    ισχυρισμών, ποσοστό άρνησης, απόκλιση προς «βοηθό», λανθάνων χρόνος.
  limitation: >-
    Είναι λεξικοί και δομικοί προσεγγιστές, όχι σημασιολογική κρίση.
    Η αξιολόγηση με NLI και μελέτη ανθρώπινης προτίμησης δηλώνονται ως
    μελλοντική εργασία.

# Ρητός κατάλογος εργαλείων.
#
# Προστέθηκε επειδή ο έλεγχος allowlist (unsupported_technologies) βρήκε ότι
# το ίδιο το αρχείο αλήθειας ήταν ελλιπές: PyTorch, Docker, FastAPI και Colab
# χρησιμοποιούνται και δεν αναφέρονταν πουθενά. Η οδηγία στο τέλος του
# αρχείου λέει «μην αναφέρεις εργαλείο που δεν γράφεται εδώ», οπότε το κενό
# ζητούσε από το μοντέλο να ΜΗΝ πει την αλήθεια. Ένα ελλιπές αρχείο
# θεμελίωσης δεν κάνει το σύστημα πιο προσεκτικό· το κάνει πιο ασαφές, και η
# ασάφεια είναι το κενό που γεμίζει με επινοήσεις.
#
# Ό,τι δεν είναι σε αυτή τη λίστα, δεν χρησιμοποιήθηκε.
stack:
  languages: Python (3.11)
  training: PyTorch, Hugging Face transformers, PEFT, bitsandbytes, TRL
  # Τα αναπτύγματα γράφονται ρητά επειδή το μοντέλο τα επινοεί αλλιώς. Είπε
  # «PEFT (PyTorch Elastic Framework)» και «TRL για transfer learning» —
  # και τα δύο ακούγονται εύλογα και είναι λάθος. Ένα ακρωνύμιο χωρίς
  # ανάπτυγμα στο prompt είναι κενό, και τα κενά γεμίζουν.
  acronyms: >-
    PEFT = Parameter-Efficient Fine-Tuning. TRL = Transformer Reinforcement
    Learning. QLoRA = Quantized Low-Rank Adaptation. LoRA = Low-Rank
    Adaptation. RAG = Retrieval-Augmented Generation. NF4 = 4-bit
    NormalFloat. GGUF = μορφή αρχείου του llama.cpp. BM25 = Best Matching 25.
    RRF = Reciprocal Rank Fusion.
  distributed: Ray (TorchTrainer)
  data: Databricks, Delta Lake, SQLite (Viber export)
  retrieval: ChromaDB, BM25 (rank-bm25), dense embeddings
  api: FastAPI, uvicorn, Pydantic
  orchestration: n8n
  runtime: Ollama (native macOS, Metal), llama.cpp GGUF
  frontend: React με Vite
  containers: Docker και Docker Compose
  integrations: GitHub (ερωτήσεις devops), Gmail και Google Calendar (σχεδιασμένα, εκκρεμούν διαπιστευτήρια)
  training_environment: Google Colab (T4/A100 ανάλογα με τη διαθεσιμότητα)
  execution_environment: τοπικά σε Apple Silicon
  not_used: >-
    Kubernetes, AWS, GCP, Azure, Django, Flask, PostgreSQL, MongoDB,
    TensorFlow, Rust, WebAssembly, blockchain, OpenAI/GPT API. Κανένα από
    αυτά δεν υπάρχει στην εργασία, ακόμα κι αν ακούγεται εύλογο.

known_limitations:
  - Η εκπαίδευση δεν ολοκλήρωσε πλήρες epoch λόγω εξάντλησης GPU quota.
  - Το πείραμα κλιμάκωσης Ray έχει μία μόνο διαμόρφωση worker.
  - >-
    Η proactive λειτουργία υπάρχει ως μοντέλο βαρύτητας και κατωφλίου, αλλά
    δεν έχει συνδεθεί με ζωντανές πηγές (Gmail/Calendar) — τα διαπιστευτήρια
    εκκρεμούν.
  - Τα registers βασίζονται σε λέξεις-κλειδιά, όχι σε μαθημένο ταξινομητή.
  - >-
    Ο adapter εκπαιδεύτηκε σε corpus που περιείχε επώνυμα τρίτων. Το
    καθαρό corpus (v5) υπάρχει, η επανεκπαίδευση εκκρεμεί, και μέχρι τότε
    η προστασία είναι φίλτρο εξόδου και όχι απουσία από τα βάρη.
